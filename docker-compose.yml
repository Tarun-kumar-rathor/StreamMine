version: '3.8'

services:
  # Optional Kafka-compatible high-performance streaming engine
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: stream-redpanda
    command:
      - redpanda start
      - --smp 1
      - --memory 512M
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    networks:
      - streammine-net

  ai-inference:
    build:
      context: ./services/ai-inference
      dockerfile: Dockerfile
    container_name: streammine-ai-inference
    ports:
      - "8000:8000"
    volumes:
      - ./services/ai-trainer/weights:/app/weights:ro
    environment:
      - WEIGHTS_DIR=/app/weights
    networks:
      - streammine-net
    restart: unless-stopped

  ai-trainer:
    build:
      context: ./services/ai-trainer
      dockerfile: Dockerfile
    container_name: streammine-ai-trainer
    volumes:
      - ./services/ai-trainer/weights:/app/weights
    profiles:
      - training
    networks:
      - streammine-net

networks:
  streammine-net:
    driver: bridge
